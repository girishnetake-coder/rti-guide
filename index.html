<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:linear-gradient(135deg,#1a5490 0%,#0d3b66 100%);min-height:100vh;color:#333;line-height:1.6;padding-bottom:30px}
.header{text-align:center;color:white;padding:22px 15px 12px}
.header h1{font-size:24px;margin-bottom:4px}
.header p{font-size:12px;opacity:.9}
.content{padding:15px;max-width:700px;margin:0 auto 30px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.card h3{font-size:15px;color:#1a5490;margin-bottom:12px}
.sr{display:flex;gap:8px}
.sr input{flex:1;padding:14px;border:2px solid #1a5490;border-radius:10px;font-size:15px;background:#f0f7ff;font-family:sans-serif}
.sr input:focus{outline:none;border-color:#0d3b66;background:white}
.mic{width:52px;background:#c9a227;color:white;border:none;border-radius:50%;font-size:22px;cursor:pointer}
.sbtn{display:block;width:100%;padding:14px;margin-top:10px;background:#1a5490;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;font-family:sans-serif}
.qq{display:block;width:100%;padding:11px 14px;margin-bottom:8px;background:#f8f9fb;border:2px solid #e2e8f0;border-radius:10px;font-size:13px;text-align:left;cursor:pointer;font-family:sans-serif;color:#333}
.ans{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none}
.ans.show{display:block}
.ans h3{color:#1a5490;font-size:16px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
.atxt{font-size:15px;color:#333;line-height:1.8;white-space:pre-wrap}
.aact{display:flex;gap:8px;margin-top:14px}
.aact button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;font-family:sans-serif}
.spk{background:#27ae60;color:white}
.gem{background:#4285f4;color:white}
.foot{text-align:center;font-size:11px;color:#ccc;padding:20px 10px}
.apply-card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.15);text-align:center}
.apply-btn{display:block;width:100%;padding:22px;background:linear-gradient(135deg,#1a5490 0%,#0d3b66 100%);color:white;border:none;border-radius:14px;font-size:20px;font-weight:bold;cursor:pointer;font-family:sans-serif}
.apply-menu{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none}
.type-btn{display:block;width:100%;padding:16px;margin-bottom:10px;background:#f8f9fb;border:2px solid #e2e8f0;border-radius:12px;text-align:left;cursor:pointer;font-family:sans-serif}
.type-btn b{font-size:16px;color:#1a5490;display:block;margin-bottom:4px}
.type-btn span{font-size:12px;color:#666}
.topbar{background:linear-gradient(135deg,#1a5490 0%,#0d3b66 100%);color:white;padding:12px 15px;display:none;align-items:center;position:sticky;top:0;z-index:50}
.topbar.show{display:flex}
.topbar button{background:rgba(255,255,255,.2);border:none;color:white;font-size:20px;width:38px;height:38px;border-radius:50%;margin-right:10px;cursor:pointer}
.topbar h2{font-size:15px;flex:1}
.paper{background:white;margin:12px;padding:20px 18px;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-family:'Times New Roman',serif;font-size:15px;line-height:2;color:#222;display:none}
.paper.show{display:block}
.paper-heading{text-align:center;font-size:16px;font-weight:bold;color:#0d3b66;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #0d3b66}
.paper p{margin:12px 0;line-height:2.2}
.inp{display:inline-block;border:1.5px dashed #1a5490;background:#f0f7ff;color:#0d3b66;font-weight:bold;padding:6px 10px;font-size:15px;font-family:sans-serif;min-width:180px;max-width:100%;border-radius:6px}
.inp::placeholder{color:#5a7fb0;font-style:italic;font-weight:normal;opacity:1;font-size:14px}
.inp:focus{outline:none;border:2px solid #c9a227;background:#fff3cd}
.inp.filled{color:#27ae60;border:1.5px solid #27ae60;background:#e8f8ee;font-weight:bold}
.inp::placeholder{color:#7a9cc6;font-style:italic;font-weight:normal;opacity:1}
.inp:focus{outline:none;border:2px solid #c9a227;background:#fff3cd}
.inp.filled{color:#27ae60;border:1.5px solid #27ae60;background:#e8f8ee;font-weight:bold}
.inp:focus{outline:none;border-bottom:2px solid #c9a227;background:#fff3cd}
.inp.filled{color:#27ae60;border-bottom:1.5px solid #27ae60;background:#e8f8ee}
.tex{display:block;width:100%;min-height:55px;border:1.5px dashed #1a5490;background:#f0f7ff;color:#0d3b66;font-weight:bold;padding:8px;font-size:15px;font-family:sans-serif;border-radius:6px;margin:6px 0;resize:vertical}
.tex::placeholder{color:#5a7fb0;font-style:italic;font-weight:normal;opacity:1;font-size:14px}
.tex::placeholder{color:#7a9cc6;font-style:italic;font-weight:normal;opacity:1}
.tex:focus{outline:none;border:2px solid #c9a227;background:#fff3cd}
.tex.filled{color:#222;border:1.5px solid #27ae60;background:#e8f8ee;font-weight:normal}
.q-list{list-style:none;padding:0;margin:10px 0}
.q-list li{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;padding:8px;background:#e8f8ee;border-left:3px solid #27ae60;border-radius:6px;color:#222;font-size:14px;font-family:sans-serif}
.q-list li .q-num{font-weight:bold;color:#27ae60;min-width:20px}
.q-list li .q-edit{background:#3498db;color:white;border:none;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:auto}
.q-input-row{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px;background:#f0f7ff;border:2px dashed #1a5490;border-radius:8px}
.q-input-row input{flex:1;border:none;background:transparent;font-size:15px;color:#1a5490;padding:6px;font-family:sans-serif;outline:none}
.q-input-row button{padding:8px 12px;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer;font-family:sans-serif}
.q-add{background:#27ae60;color:white}
.q-mic{background:#c9a227;color:white}
.final{background:white;border-radius:16px;padding:18px;margin:12px;box-shadow:0 2px 12px rgba(0,0,0,.15);display:none}
.final.show{display:block}
.final h3{color:#27ae60;text-align:center;margin-bottom:12px}
.final-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.final-btns button{padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;font-family:sans-serif;color:white}
.btn-print{background:#1a5490}
.btn-share{background:#25d366}
.btn-pdf{background:#27ae60}
.btn-copy{background:#c9a227}
.btn-new{background:#888;grid-column:1/-1}
.float-mic{position:fixed;bottom:20px;right:20px;width:64px;height:64px;border-radius:50%;background:#c9a227;color:white;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.3);z-index:999;display:none}
.float-mic.show{display:block}
.float-mic.listening{background:#ff4757;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,71,87,.7)}70%{box-shadow:0 0 0 15px rgba(255,71,87,0)}100%{box-shadow:0 0 0 0 rgba(255,71,87,0)}}
@media print{
body{background:white!important;padding:0!important;margin:0!important}
.header,.content,.topbar,.final,.float-mic,.foot,#stickyMic,#applyMenu,#applyCard,.card,.ans,.apply-card,.apply-menu,.q-input-row{display:none!important}
.paper{display:block!important;box-shadow:none!important;margin:0!important;padding:15mm!important;background:white!important;font-family:serif!important;font-size:12pt!important;line-height:1.9!important;color:#000!important;width:100%!important}
.paper p{display:block!important;margin:10px 0!important;flex:none!important;line-height:1.9!important}
.inp{border:none!important;background:none!important;color:#000!important;padding:0!important;font-weight:bold!important;display:inline!important;min-width:0!important}
.inp.filled{color:#000!important;font-weight:bold!important}
.tex{border:none!important;background:none!important;color:#000!important;padding:0!important;font-weight:bold!important;display:block!important;min-height:auto!important;margin:5px 0!important}
.tex.filled{color:#000!important;font-weight:bold!important}
.q-list{list-style:decimal!important;padding-left:24px!important;display:block!important}
.q-list li{display:list-item!important;background:none!important;border:none!important;padding:0!important;margin:6px 0!important;color:#000!important}
.q-edit{display:none!important}
}
</style>

function m2e(s){var m={"०":"0","१":"1","२":"2","३":"3","४":"4","५":"5","६":"6","७":"7","८":"8","९":"9"};return s.replace(/[०-९]/g,function(x){return m[x]})}
function w2n(s){var w={"एकतीस":31,"तीस":30,"एकोणतीस":29,"अठ्ठावीस":28,"सत्तावीस":27,"सव्वीस":26,"पंचवीस":25,"चोवीस":24,"तेवीस":23,"बावीस":22,"एकवीस":21,"वीस":20,"एकोणीस":19,"अठरा":18,"सतरा":17,"सोळा":16,"पंधरा":15,"चौदा":14,"तेरा":13,"बारा":12,"अकरा":11,"दहा":10,"नऊ":9,"आठ":8,"सात":7,"सहा":6,"पाच":5,"चार":4,"तीन":3,"दोन":2,"एक":1};var k=Object.keys(w).sort(function(a,b){return b.length-a.length});for(var i=0;i<k.length;i++){if(s.indexOf(k[i])>-1)return w[k[i]]}return null}
function show(t){
  var fullText = t + "\n\n━━━━━━━━━━━━━━\n\n💡 या उत्तराने समाधान झाले नाही?\n👉 '✨ Gemini' बटण दाबा — Google Gemini मध्ये अजून माहिती शोधा.";
  lastAnswer = fullText;
  document.getElementById("ansText").textContent = fullText;
  document.getElementById("ansBox").classList.add("show");
  speakText(t);
  document.getElementById("ansBox").scrollIntoView({behavior:"smooth",block:"start"});
}
function section(n){var s=SECTIONS[n];return "📖 कलम "+n+" — "+s.title+"\n\n📜 कायद्यातील मजकूर:\n"+s.text+"\n\n💡 सोप्या भाषेत:\n"+s.simple+"\n\n🎯 कधी वापरायचे:\n"+s.use}
function doSearch(){var q=document.getElementById("query").value.trim();if(!q){alert("कृपया प्रश्न लिहा.");return}ask(q)}
function ask(q){
  document.getElementById("query").value = q;
  var qq = q.toLowerCase().trim();
  var qE = m2e(qq);
  if(qq.indexOf("सर्व कलम")>-1||qq.indexOf("सगळे कलम")>-1){
    var l="📚 सर्व ३१ कलमे:\n\n";
    for(var i=1;i<=31;i++){if(SECTIONS[i])l+="कलम "+i+": "+SECTIONS[i].title+"\n"}
    show(l);return;
  }
  var sn=null;
  var dm=qE.match(/कलम\s*(\d+)/)||qE.match(/(\d+)\s*कलम/)||qE.match(/section\s*(\d+)/);
  if(dm)sn=parseInt(dm[1]);
  if(!sn&&qq.indexOf("कलम")>-1){
    var cn=qq.replace(/कलम/g,"").replace(/[।,.?!]/g,"").trim();
    var wn=w2n(cn);
    if(wn)sn=wn;
  }
  if(sn&&SECTIONS[sn]){show(section(sn));return}
  var words = qq.replace(/[।,.?!;:]/g," ").split(/\s+/).filter(function(w){return w.length>=2});
  if(words.length===0)words=[qq];
  var matches=[];
  for(var k=1;k<=31;k++){
    if(!SECTIONS[k])continue;
    var s=SECTIONS[k];
    var full=((s.title||"")+" "+(s.text||"")+" "+(s.simple||"")+" "+(s.use||"")).toLowerCase();
    var sc=0;
    for(var w=0;w<words.length;w++){
      var ww=words[w];
      if(ww.length<2)continue;
      if(full.indexOf(ww)>-1)sc+=3;
    }
    if(sc>0)matches.push({num:k,score:sc});
  }
  matches.sort(function(a,b){return b.score-a.score});
  if(matches.length===1){show(section(matches[0].num));return}
  if(matches.length>1){
    var r="📚 तुमच्या शब्दांशी संबंधित "+matches.length+" कलमे:\n\n";
    for(var m=0;m<matches.length&&m<8;m++){
      var mn=matches[m].num;
      r+="━━━━━━━━━━━━━━\n📖 कलम "+mn+" — "+SECTIONS[mn].title+"\n"+SECTIONS[mn].simple+"\n\n";
    }
    r+="━━━━━━━━━━━━━━\n💡 पूर्ण पाहण्यासाठी \"कलम "+matches[0].num+"\" टाइप करा.";
    show(r);return;
  }
  var tacts=(typeof RTI_DATA!=="undefined"&&RTI_DATA.tactics)?RTI_DATA.tactics:[];
  for(var t=0;t<tacts.length;t++){
    var tac=tacts[t];
    for(var tk=0;tk<tac.keywords.length;tk++){
      if(qq.indexOf(tac.keywords[tk].toLowerCase())>-1){
        show("📌 कायदेशीर उत्तर:\n\n"+tac.response);return;
      }
    }
  }
  var decs=(typeof RTI_DATA!=="undefined"&&RTI_DATA.courtDecisions)?RTI_DATA.courtDecisions:[];
  for(var d=0;d<decs.length;d++){
    var dec=decs[d];
    var dn=dec.name.toLowerCase();
    var df=dn.split(" v. ")[0];
    if(qq.indexOf(dn)>-1||qq.indexOf(df)>-1||qq.indexOf(dec.summary.toLowerCase())>-1||qq.indexOf(dec.use.toLowerCase())>-1){
      show("⚖️ "+dec.name+" ("+dec.year+")\n📌 "+dec.court+"\n\n"+dec.summary+"\n\n🎯 "+dec.use);return;
    }
  }
  show("माफ करा, हा शब्द सापडला नाही.\n\n💡 वापरा: मुदत, दंड, अपील, अर्ज, अधिकारी, सूट, तपास, बँक, पगार\n\nकिंवा कलम क्रमांक: कलम 1, कलम 7, कलम 20");
}

function startVoice(){var b=document.getElementById("micBtn");if(!("webkitSpeechRecognition"in window)&&!("SpeechRecognition"in window)){alert("व्हॉईस चालत नाही.");return}if(listening){if(rec)rec.stop();listening=false;b.classList.remove("listening");return}var SR=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new SR();rec.lang="mr-IN";rec.continuous=false;rec.interimResults=false;rec.onstart=function(){listening=true;b.classList.add("listening")};rec.onresult=function(e){var t=e.results[0][0].transcript;document.getElementById("query").value=t;ask(t)};rec.onerror=function(){listening=false;b.classList.remove("listening");alert("ऐकू आले नाही.")};rec.onend=function(){listening=false;b.classList.remove("listening")};try{rec.start()}catch(e){alert("व्हॉईस सुरू झाले नाही.")}}

h+='<p>प्रथम अपील अधिकारी,</p><p><input class="inp" id="f-vibhag" data-key="vibhag" placeholder="विभाग" />,</p>';

h+='<div style="margin-top:22px;text-align:right">';

h+='<button onclick="finishApp()" style="display:block;width:100%;padding:16px;margin-top:20px;background:#27ae60;color:white;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;font-family:sans-serif">✅ अर्ज पूर्ण करा</button>';

var all=document.querySelectorAll(".inp, .tex");
for(var i=0;i<all.length;i++){all[i].addEventListener("focus",onFocus);all[i].addEventListener("blur",onBlur);all[i].addEventListener("input",onInput)}
renderQuestions()}

function onFocus(e){lastFocus=e.target;e.target.classList.remove("filled")}
function onBlur(e){if(e.target.value.trim())e.target.classList.add("filled")}
function onInput(e){if(e.target.value.trim())e.target.classList.add("filled");else e.target.classList.remove("filled");
if(e.target.id==="f-naav"){var n=document.getElementById("f-naav2");if(n)n.value=e.target.value}}

function renderQuestions(){var l=document.getElementById("qList");var ab=document.getElementById("qAddBox");if(!l||!ab)return;
var h="";
for(var i=0;i<questions.length;i++){h+='<li><span class="q-num">'+(i+1)+'.</span><span style="flex:1">'+escapeHtml(questions[i])+'</span><button class="q-edit" onclick="editQ('+i+')">✏️</button><button class="q-edit" onclick="delQ('+i+')" style="background:#e74c3c">✕</button></li>'}
l.innerHTML=h;
if(questions.length<15){var n=questions.length+1;
ab.innerHTML='<div class="q-input-row"><span style="color:#1a5490;font-weight:bold">'+n+'.</span><input type="text" id="qNew" placeholder="प्रश्न '+n+' टाइप करा..." /><button class="q-mic" onclick="voiceQ()">🎤</button><button class="q-add" onclick="addQ()">+ जोडा</button></div>'}
else{ab.innerHTML='<p style="color:#888;font-size:13px;text-align:center">✅ १५ प्रश्न पूर्ण</p>'}}

function addQ(){var i=document.getElementById("qNew");if(!i)return;var v=i.value.trim();if(!v){alert("प्रश्न टाइप करा.");return}questions.push(v);renderQuestions();setTimeout(function(){var n=document.getElementById("qNew");if(n)n.focus()},100)}
function editQ(i){var v=prompt("प्रश्न बदला:",questions[i]);if(v&&v.trim()){questions[i]=v.trim();renderQuestions()}}
function delQ(i){if(!confirm("प्रश्न काढायचा?"))return;questions.splice(i,1);renderQuestions()}
function voiceQ(){if(!("webkitSpeechRecognition"in window)&&!("SpeechRecognition"in window)){alert("व्हॉईस चालत नाही.");return}var i=document.getElementById("qNew");var SR=window.SpeechRecognition||window.webkitSpeechRecognition;var r=new SR();r.lang="mr-IN";r.onresult=function(e){if(i)i.value=e.results[0][0].transcript};try{r.start()}catch(e){}}

function voiceFill(){if(!("webkitSpeechRecognition"in window)&&!("SpeechRecognition"in window)){alert("व्हॉईस चालत नाही.");return}if(!lastFocus||!lastFocus.tagName){alert("आधी कागदावरील जागेवर टॅप करा.");return}
var b=document.getElementById("floatMic");var SR=window.SpeechRecognition||window.webkitSpeechRecognition;var r=new SR();r.lang="mr-IN";r.continuous=false;r.interimResults=false;b.classList.add("listening");
r.onresult=function(e){var t=e.results[0][0].transcript;if(lastFocus){lastFocus.value=t;lastFocus.classList.add("filled");if(lastFocus.id==="f-naav"){var n=document.getElementById("f-naav2");if(n){n.value=t;n.classList.add("filled")}}}};
r.onend=function(){b.classList.remove("listening")};r.onerror=function(){b.classList.remove("listening")};try{r.start()}catch(e){b.classList.remove("listening")}}

function finishApp(){if(!questions.length){if(!confirm("एकही प्रश्न नाही. पुढे जायचे?"))return}
document.getElementById("floatMic").classList.remove("show");
document.getElementById("finalBox").classList.add("show");
document.getElementById("finalBox").scrollIntoView({behavior:"smooth",block:"start"})}

function escapeHtml(t){var d=document.createElement("div");d.appendChild(document.createTextNode(t));return d.innerHTML}




function downloadPDF() {
  if (!confirm("📥 PDF तयार करण्यासाठी:\n\n१. खालील 'OK' दाबा\n२. Print dialog उघडेल\n३. वरच्या 'Printer' वर टॅप करा\n४. 'Save as PDF' निवडा\n५. 'Save' दाबा\n\nPDF तुमच्या Downloads मध्ये जाईल ✅\n\nचालू ठेवायचे?")) return;
  setTimeout(function() { window.print(); }, 300);
}


function shareApp() {
  var paper = document.getElementById("paper");
  var txt = paper ? paper.innerText : "";
  if (!txt || txt.length < 20) {
    alert("आधी अर्ज भरा.");
    return;
  }
  if (navigator.share) {
    navigator.share({ title: "RTI अर्ज", text: txt }).catch(function(){});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function() {
      alert("अर्ज कॉपी झाला! WhatsApp मध्ये पेस्ट करा.");
    });
  } else {
    alert("शेअर शक्य नाही.");
  }
}

function copyApp(){var t=document.getElementById("paper").innerText;if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert("अर्ज कॉपी झाला!")})}else{alert("कॉपी करण्यासाठी अर्जावर लांब दाबा.")}}
